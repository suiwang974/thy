# 桃花源 Release：新工程（taohuayuan/ 目录，从零重写版）的打包。
# 提速：迭代打包只打 arm64 release 一个包（用户手机就是 arm64），
# 不要 split-per-abi 全套 + universal + debug 一起打；最终版再打全套。
# Pub + Gradle 全开缓存，第二次以后不用每次重新下载依赖。
name: Taohuayuan Release

on:
  workflow_dispatch:
  # workflow_dispatch 在新分支上首次跑之前 API 会 404（workflow 未注册），
  # 所以同时接受 tag 推送触发：打 tag 即打包。
  push:
    tags:
      - 'taohuayuan-v*'

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  android:
    name: Android arm64
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Set Up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Cache Pub Dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('taohuayuan/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Install Dependencies
        working-directory: taohuayuan
        run: flutter pub get

      - name: Decode release keystore
        # 第 62 条：固定发布签名。keystore 以 base64 存在 GitHub Secrets，
        # 这里解码写出 android/app/release.keystore 与 android/key.properties，
        # 两者都不进 Git（android/.gitignore 已覆盖 key.properties / *.keystore）。
        run: |
          echo "${{ secrets.TAOHUAYUAN_KEYSTORE_BASE64 }}" | base64 -d > taohuayuan/android/app/release.keystore
          cat > taohuayuan/android/key.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.TAOHUAYUAN_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.TAOHUAYUAN_KEY_ALIAS }}
          keyPassword=${{ secrets.TAOHUAYUAN_KEY_PASSWORD }}
          EOF

      - name: Build arm64 Release APK
        working-directory: taohuayuan
        run: flutter build apk --release --target-platform android-arm64

      - name: Read version
        # 第 50 条（应用内更新）：tag 从 pubspec 的 versionCode 来，
        # 每轮 bump 一次 versionCode 就自动出一个新 tag（taohuayuan-v10），
        # App 读 GitHub Releases latest、拿 tag 里的数字跟本机 versionCode 比，
        # 不用再靠固定 tag + 人工改 version.json。
        # tag 名就是发布号，跟 App 里显示的“v10”同一套。
        id: ver
        working-directory: taohuayuan
        run: |
          CODE=$(grep '^version:' pubspec.yaml | sed 's/.*+//')
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "tag=taohuayuan-v$CODE" >> "$GITHUB_OUTPUT"
          {
            echo 'notes<<EOF'
            git log -1 --pretty=%B
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Rename APK
        # 只打 arm64 一个包（不 split-per-abi），输出就是 app-release.apk，不是 app-arm64-v8a-release.apk。
        run: mv taohuayuan/build/app/outputs/flutter-apk/app-release.apk taohuayuan-android-arm64-v2.9.0.apk

      - name: Upload Release Asset
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.ver.outputs.tag }}
          name: 桃花源 v${{ steps.ver.outputs.code }}（重写版）
          body: "桃花源从零重写版 v${{ steps.ver.outputs.code }}：\n${{ steps.ver.outputs.notes }}"
          allowUpdates: true
          replacesArtifacts: true
          artifacts: taohuayuan-android-arm64-v2.9.0.apk
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
